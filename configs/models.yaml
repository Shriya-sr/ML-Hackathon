# Baseline (untuned) configurations for every model experimented with.
# Every model sees the same feature schema (src/pathsnap/features/feature_schema.py)
# and the same trip-grouped folds.
cv:
  n_splits: 5
  seed: 42
  decision_threshold: 0.5      # used for accuracy / precision / recall / F1 on candidate rows

models:
  logistic_regression:
    family: Linear / probabilistic
    params: {C: 1.0, max_iter: 3000, class_weight: null}
  gaussian_nb:
    family: Probabilistic (generative)
    params: {var_smoothing: 1.0e-9}
  knn:
    family: Instance-based
    params: {n_neighbors: 25, weights: distance}
    max_train_rows: 60000          # KNN prediction cost grows with stored rows
  random_forest:
    family: Ensemble (bagging)
    params: {n_estimators: 200, max_depth: null, min_samples_leaf: 5, max_features: sqrt, n_jobs: -1}
  extra_trees:
    family: Ensemble (randomised trees)
    params: {n_estimators: 200, max_depth: null, min_samples_leaf: 5, max_features: sqrt, n_jobs: -1}
  hist_gradient_boosting:
    family: Boosting
    params: {learning_rate: 0.1, max_iter: 300, max_leaf_nodes: 31, min_samples_leaf: 20,
             l2_regularization: 0.0, early_stopping: true, validation_fraction: 0.1, n_iter_no_change: 15}
  svm_rbf:
    family: Kernel-based
    params: {C: 1.0, gamma: scale}
    calibration: sigmoid           # Platt scaling via CalibratedClassifierCV(cv=3, ensemble=False)
    max_train_rows: 20000          # O(n^2) kernel training -> trip-stratified subsample
  mlp:
    family: Neural network
    params: {hidden_layer_sizes: [64, 32], alpha: 0.0001, learning_rate_init: 0.001, max_iter: 200,
             early_stopping: true, validation_fraction: 0.1, n_iter_no_change: 10, batch_size: 512}
